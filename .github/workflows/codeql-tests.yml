name: codeql-tests
run-name: Run CodeQL Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  codeql-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch CodeQL
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-codeql
          gh codeql version
          printf "CODEQL_FETCHED_CODEQL_PATH=" >> "${GITHUB_ENV}"
          gh codeql version --format=json | jq -r .unpackedLocation >> "${GITHUB_ENV}"
          gh codeql version --format=json | jq -r .unpackedLocation >> "${GITHUB_PATH}"

      - name: Install main query pack dependencies
        run: |
          cd src/main/ql
          codeql pack install

      - name: Install test pack dependencies
        run: |
          cd src/test/ql/test
          codeql pack install

      - name: Run CodeQL tests
        run: |
          codeql test run src/test/ql/test/query-tests --search-path src/main/ql
